<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050505;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <video id="poster-source" autoplay muted playsinline></video>
    <script>
      const file = new URLSearchParams(window.location.search).get("src");
      const video = document.querySelector("#poster-source");

      video.src = `public/media/${file}`;
      video.addEventListener("loadedmetadata", () => {
        video.currentTime = Math.min(1, video.duration / 4);
      });
      video.play().catch(() => {});
    </script>
  </body>
</html>
